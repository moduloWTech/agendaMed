name: Build Android App (Bubblewrap)

on:
  push:
    branches:
      - main
    paths:
      - 'twa-manifest.json'
      - 'frontend/public/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Build Android App (.aab)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          docker run --rm \
            -v ${PWD}:/app \
            -w /app \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build \
            --manifest=twa-manifest.json \
            --keyPassword="$ANDROID_KEYSTORE_PASSWORD" \
            --keyStorePassword="$ANDROID_KEYSTORE_PASSWORD"

      - name: Upload Android App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agendamed-android-app
          path: app-release-bundle.aab
