name: Build Android App (Bubblewrap)

on:
  push:
    branches:
      - main
    paths:
      - 'twa-manifest.json'
      - 'frontend/public/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is empty in the runner!"
            exit 1
          fi
          # Print length for debugging (safely)
          echo "Secret is present. Length: ${#ANDROID_KEYSTORE_BASE64}"
          # Use printf and tr to safely decode multi-line base64 without echo glitches
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android.keystore
          ls -la android.keystore

      - name: Build Android App (.aab)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # 1. Update/Generate the project unconditionally (answering yes if prompted)
          echo "y" | docker run -i --rm \
            -v ${PWD}:/app \
            -w /app \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            update
            
          echo "Debugging Keystore:"
          ls -la
          
          if [ ! -s android.keystore ]; then
            echo "ERROR: android.keystore is missing or empty!"
            echo "Please check if ANDROID_KEYSTORE_BASE64 secret is correctly set in GitHub."
          fi
            
          # 2. Build the Android app bundle
          docker run --rm \
            -v ${PWD}:/app \
            -w /app \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -e BUBBLEWRAP_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build \
            --manifest=twa-manifest.json
            
          echo "Build finished. Looking for .aab files:"
          find . -name "*.aab"

      - name: Upload Android App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agendamed-android-app
          path: '**/*.aab'
