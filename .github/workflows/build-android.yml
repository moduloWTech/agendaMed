name: Build Android App (Bubblewrap)

on:
  push:
    branches:
      - main
    paths:
      - 'twa-manifest.json'
      - 'frontend/public/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Bubblewrap
        run: npm install -g @GoogleChromeLabs/bubblewrap

      - name: Setup Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Build Android App (.aab)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # The manifest contains the signingKey path pointing to ./android.keystore
          bubblewrap build \
            --manifest=twa-manifest.json \
            --keyPassword="$ANDROID_KEYSTORE_PASSWORD" \
            --keyStorePassword="$ANDROID_KEYSTORE_PASSWORD"

      - name: Upload Android App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agendamed-android-app
          path: app-release-bundle.aab
