name: CI Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-check:
    name: Validate API (TypeScript, Prisma & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "api/package-lock.json"

      - name: Install API Dependencies
        run: npm ci
        working-directory: api

      - name: Validate Prisma Schema
        run: npx prisma validate
        working-directory: api

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: api

      - name: Build & Typecheck API
        run: npm run build
        working-directory: api

  frontend-check:
    name: Validate Frontend (TypeScript, Lint, Test & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck Frontend
        run: npx tsc -b
        working-directory: frontend

      - name: Lint Frontend
        run: npm run lint
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm test
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
