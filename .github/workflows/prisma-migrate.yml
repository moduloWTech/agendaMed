name: Prisma Database Migrate (Supabase)

on:
  push:
    branches:
      - main
    paths:
      - "api/prisma/**"
      - ".github/workflows/prisma-migrate.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Run Prisma Migrations on Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "api/package-lock.json"

      - name: Install API Dependencies
        run: npm ci
        working-directory: api

      - name: Run Prisma Migrate Deploy
        env:
          SECRET_DIRECT: ${{ secrets.DIRECT_URL_PROD }}
          SECRET_DB: ${{ secrets.DATABASE_URL }}
        run: |
          URL="${SECRET_DIRECT:-$SECRET_DB}"
          if [ -z "$URL" ]; then
            echo "::error::Nenhuma secret de banco de dados (DATABASE_URL ou DIRECT_URL_PROD) foi cadastrada no GitHub Secrets."
            echo "Para resolver, adicione a secret DATABASE_URL no seu repositório no GitHub:"
            echo "  Acesse: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "  Nome: DATABASE_URL (ou DIRECT_URL_PROD)"
            echo "  Valor: URL de conexão do PostgreSQL Supabase"
            exit 1
          fi
          DATABASE_URL="$URL" npx prisma migrate deploy
        working-directory: api
