name: Deploy AgendaMed API to GCP

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy-agendamed-api.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: modulowtech/agendamed-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            # 1. Faz login no GitHub Container Registry de dentro da VM
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Faz o Pull da versão mais recente da imagem
            sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # 3. Derruba o contêiner em execução (se existir)
            sudo docker stop agendamed-api-container || true
            sudo docker rm agendamed-api-container || true
            
            # 4. Rede Docker para comunicação interna (Opcional, mas segue padrão MWT)
            sudo docker network create agilizai-network || true
            
            # 5. Roda o novo contêiner mapeando as portas, env e VOLUME DO WHATSAPP!
            sudo docker run -d \
              --name agendamed-api-container \
              --network agilizai-network \
              --restart unless-stopped \
              -p 3333:3333 \
              --env-file /home/${{ secrets.GCP_VM_USERNAME }}/agendaMed-api/.env \
              -v /home/${{ secrets.GCP_VM_USERNAME }}/agendaMed-api/auth_info_baileys:/app/auth_info_baileys \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # 6. Limpeza
            sudo docker image prune -f
